<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="color-scheme" content="light dark" />
        <title>Extensions</title>
        <link rel="icon" type="image/png" href="resource://icons/48x48/app-browser.png" />
        <link rel="stylesheet" type="text/css" href="resource://ladybird/ladybird.css" />
        <link rel="stylesheet" type="text/css" href="resource://ladybird/about-pages/webui.css" />
        <style>
            body {
                max-width: 860px;
                padding: 48px 24px;
            }

            .extension {
                display: grid;
                grid-template-columns: 48px minmax(0, 1fr) auto;
                gap: 4px 16px;
                align-items: start;

                padding: 16px 20px;
            }

            .extension + .extension,
            .load-error + .load-error {
                border-top: 1px solid var(--border-color);
            }

            .extension-icon {
                grid-row: span 3;
                width: 48px;
                height: 48px;
                object-fit: contain;
            }

            /* An extension without an icon gets the first letter of its name. */
            .extension-icon.placeholder {
                display: flex;
                align-items: center;
                justify-content: center;

                border-radius: 10px;
                background-color: var(--control);
                color: var(--secondary-text-color);
                font-size: 22px;
                font-weight: 600;
            }

            .extension-name {
                font-size: 15px;
                font-weight: 600;
                overflow-wrap: anywhere;
            }

            .extension-version {
                margin-left: 6px;
                color: var(--secondary-text-color);
                font-weight: 400;
            }

            .extension-actions {
                grid-row: span 3;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .extension-actions input[type="checkbox"][switch] {
                margin-left: 4px;
            }

            /* A turned-off extension stays listed, faded, so that it can be turned on again. */
            .extension.disabled :is(.extension-icon, .extension-name, .extension-description) {
                opacity: 0.5;
            }

            .extension-state {
                margin-left: 6px;
                color: var(--secondary-text-color);
                font-weight: 400;
            }

            .extension-failure {
                grid-column: 2 / span 2;
                color: var(--error);
                overflow-wrap: anywhere;
            }

            .extension-description {
                overflow-wrap: anywhere;
            }

            .extension-description:empty {
                display: none;
            }

            details {
                grid-column: 2 / span 2;
                margin-top: 4px;
            }

            summary {
                width: fit-content;
                margin-left: -6px;
                padding: 2px 6px;
                border-radius: 5px;

                color: var(--secondary-text-color);
                cursor: pointer;
            }

            summary:hover {
                background-color: var(--control);
            }

            dl {
                display: grid;
                grid-template-columns: minmax(120px, 24%) 1fr;
                gap: 6px 16px;

                margin: 8px 0 0 0;
            }

            dt {
                color: var(--secondary-text-color);
            }

            dd {
                margin: 0;
                overflow-wrap: anywhere;
            }

            .monospace {
                font-family: monospace;
            }

            .load-error {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 0 16px;
                align-items: start;

                padding: 16px 20px;
            }

            .load-error > :not(.load-error-title, button) {
                grid-column: 1;
            }

            .load-error > button {
                grid-row: span 3;
            }

            .load-error-title {
                color: var(--error);
                font-weight: 600;
            }

            .load-error-title::before {
                content: "⚠ ";
            }

            .load-error-directory {
                margin-top: 4px;
                overflow-wrap: anywhere;
                font-family: monospace;
            }

            .load-error-message {
                margin-top: 4px;
                color: var(--secondary-text-color);
            }

            dialog {
                color: var(--text);
                background-color: var(--surface);
                box-shadow:
                    0 0 0 1px var(--edge),
                    var(--dialog-shadow);

                width: 90%;
                max-width: 440px;

                margin: auto;
                padding: 20px;

                border: none;
                border-radius: 12px;
                outline: none;
            }

            dialog::backdrop {
                background-color: rgba(0, 0, 0, 0.5);
            }

            .dialog-title {
                margin: 0 0 8px 0;
                font-size: 15px;
                font-weight: 600;
                overflow-wrap: anywhere;
            }

            .dialog-message {
                margin: 0;
                color: var(--secondary-text-color);
            }

            .dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 20px;
            }

            #empty {
                padding: 20px;
                color: var(--secondary-text-color);
            }

            @media (max-width: 640px) {
                body {
                    padding: 24px 16px;
                }

                .extension {
                    grid-template-columns: 48px minmax(0, 1fr);
                }

                .extension-actions {
                    grid-row: auto;
                    grid-column: 2;
                }

                details {
                    grid-column: 1 / span 2;
                }

                dl {
                    grid-template-columns: 1fr;
                    gap: 2px;
                }

                dd + dt {
                    margin-top: 6px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Extensions</h1>
        </header>

        <div id="errors-card" class="card hidden"></div>

        <div class="card">
            <div id="extensions"></div>
            <div id="empty" class="hidden">
                No extensions are loaded. Start Ladybird with
                <span class="monospace">--load-extension=&lt;folder&gt;</span> to load an unpacked extension.
            </div>
        </div>

        <dialog id="remove-dialog" closedby="any" aria-labelledby="remove-dialog-title">
            <form method="dialog">
                <h2 id="remove-dialog-title" class="dialog-title"></h2>
                <p class="dialog-message">
                    This deletes everything it saved, such as its settings. Ladybird loads it again the next time it
                    starts with <span class="monospace">--load-extension</span> for its folder; the folder itself is
                    left alone.
                </p>
                <div class="dialog-footer">
                    <button value="cancel" class="secondary-button" autofocus>Cancel</button>
                    <button value="remove" class="primary-button">Remove</button>
                </div>
            </form>
        </dialog>

        <script>
            const extensionsElement = document.querySelector("#extensions");
            const emptyElement = document.querySelector("#empty");
            const errorsCard = document.querySelector("#errors-card");
            const removeDialog = document.querySelector("#remove-dialog");

            // What went wrong when the user last changed an extension, shown under it until they change one again.
            let failure = null;

            function sendAction(name, data) {
                failure = null;
                ladybird.sendMessage(name, data);
            }

            function confirmRemoval(extension) {
                removeDialog.querySelector(".dialog-title").textContent = `Remove “${extension.name}”?`;
                removeDialog.returnValue = "";
                removeDialog.onclose = () => {
                    if (removeDialog.returnValue === "remove") sendAction("removeExtension", extension.id);
                };
                removeDialog.showModal();
            }

            function element(tag, className, text) {
                const result = document.createElement(tag);
                if (className) result.className = className;
                if (text !== undefined) result.textContent = text;
                return result;
            }

            function renderIcon(extension) {
                if (extension.icon) {
                    const icon = element("img", "extension-icon");
                    icon.src = extension.icon;
                    icon.alt = "";
                    return icon;
                }
                const placeholder = element("div", "extension-icon placeholder");
                placeholder.textContent = [...extension.name][0]?.toUpperCase() ?? "?";
                placeholder.setAttribute("aria-hidden", "true");
                return placeholder;
            }

            function renderDetails(extension) {
                const details = element("details");
                details.append(element("summary", null, "Details"));

                const list = element("dl");
                function add(term, description, className) {
                    if (description === undefined || description === null || description === "") return;
                    list.append(element("dt", null, term), element("dd", className, description));
                }

                add("ID", extension.id, "monospace");
                add("Folder", extension.directory, "monospace");
                add("Manifest version", String(extension.manifestVersion));
                if (extension.background)
                    add("Background", `${extension.background}, ${extension.backgroundRunning ? "running" : "not running"}`);
                add("Permissions", extension.permissions.join(", "), "monospace");
                add("Site access", extension.hostPermissions.join(", "), "monospace");
                add("Runs on", extension.contentScriptMatches.join(", "), "monospace");

                details.append(list);
                return details;
            }

            function renderExtension(extension) {
                const row = element("div", extension.enabled ? "extension" : "extension disabled");
                row.dataset.id = extension.id;

                const name = element("div", "extension-name", extension.name);
                if (extension.version) name.append(element("span", "extension-version", extension.version));
                if (!extension.enabled) name.append(element("span", "extension-state", "Off"));

                const actions = element("div", "extension-actions");
                if (extension.hasOptionsPage && extension.enabled) {
                    const options = element("button", "secondary-button", "Options");
                    options.addEventListener("click", () => ladybird.sendMessage("openOptionsPage", extension.id));
                    actions.append(options);
                }

                if (extension.enabled) {
                    const reload = element("button", "secondary-button", "Reload");
                    reload.title = "Load the extension again from its folder";
                    reload.addEventListener("click", () => sendAction("reloadExtension", extension.id));
                    actions.append(reload);
                }

                const remove = element("button", "secondary-button", "Remove");
                remove.addEventListener("click", () => confirmRemoval(extension));
                actions.append(remove);

                const toggle = element("input");
                toggle.type = "checkbox";
                toggle.setAttribute("switch", "");
                toggle.checked = extension.enabled;
                toggle.title = extension.enabled ? "Turn off" : "Turn on";
                toggle.setAttribute("aria-label", `${extension.enabled ? "Turn off" : "Turn on"} ${extension.name}`);
                toggle.addEventListener("change", () => {
                    // The list is drawn again once the browser has done it, or failed to.
                    toggle.disabled = true;
                    sendAction("setExtensionEnabled", { id: extension.id, enabled: toggle.checked });
                });
                actions.append(toggle);

                row.append(
                    renderIcon(extension),
                    name,
                    actions,
                    element("div", "extension-description", extension.description)
                );
                if (failure && failure.id === extension.id)
                    row.append(element("div", "extension-failure", failure.error));
                row.append(renderDetails(extension));
                return row;
            }

            function renderError(error) {
                const row = element("div", "load-error");
                const retry = element("button", "secondary-button", "Try Again");
                retry.addEventListener("click", () => sendAction("retryExtensionLoad", error.directory));
                row.append(
                    element("div", "load-error-title", "Could not load"),
                    retry,
                    element("div", "load-error-directory", error.directory),
                    element("div", "load-error-message", error.error)
                );
                return row;
            }

            document.addEventListener("WebUIMessage", event => {
                if (event.detail.name === "extensionActionFailed") {
                    failure = event.detail.data;
                    return;
                }
                if (event.detail.name !== "loadExtensions") return;

                const { extensions, errors } = event.detail.data;
                const sorted = extensions.toSorted((a, b) => a.name.localeCompare(b.name));

                // Drawing the list again keeps open the details that were.
                const openDetails = new Set(
                    [...extensionsElement.querySelectorAll(".extension > details[open]")].map(
                        details => details.parentElement.dataset.id
                    )
                );

                const rows = sorted.map(renderExtension);
                for (const row of rows) if (openDetails.has(row.dataset.id)) row.querySelector("details").open = true;
                extensionsElement.replaceChildren(...rows);
                emptyElement.classList.toggle("hidden", extensions.length > 0);

                errorsCard.replaceChildren(...errors.map(renderError));
                errorsCard.classList.toggle("hidden", errors.length === 0);
            });

            document.addEventListener("WebUILoaded", () => ladybird.sendMessage("loadExtensions"));
        </script>
    </body>
</html>
