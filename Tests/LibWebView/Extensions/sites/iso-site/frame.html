<!DOCTYPE html><head></head><script>
const load = (id, p) => new Promise(res => { const s = document.createElement("script"); s.src = `chrome-extension://${id}/${p}`; s.onload = () => res("loaded"); s.onerror = () => res("blocked"); document.head.appendChild(s); });
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  const a = await load(id, "secret.js"), b = await load(id, "public.js");
  console.log("ISOTEST web iframe in bg page: secret.js=" + a + " public.js=" + b + " LEAK=" + window.LEAK + " chrome=" + typeof chrome);
})();
</script>
